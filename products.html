<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Products | PromoSphere</title>
  <meta name="description" content="Browse all discovered products across multiple categories.">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>

  <header class="site-header">
    <div class="site-container header-inner">
      <a href="index.html" class="brand-logo" aria-label="PromoSphere Home">
        <span class="brand-dot" aria-hidden="true"></span>
        <span>PromoSphere</span>
      </a>
      <nav>
        <a href="products.html" class="nav-link" aria-current="page">View All Products</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="site-container page-top-spacing">
      <div class="search-box catalog-search-wrap">
        <label for="search-input" class="sr-only">Search catalog</label>
        <input 
          type="search" 
          id="search-input" 
          class="search-input" 
          placeholder="Search by product name or 6-digit code..." 
          autocomplete="off"
        >
        <button type="button" id="search-clear" class="search-clear-btn" aria-label="Clear Search">&times;</button>
      </div>

      <div class="category-section" aria-label="Product Categories">
        <div id="category-container" class="category-scroll-container"></div>
      </div>

      <div class="section-header catalog-header-wrap">
        <h1 class="section-title">All Catalog Items</h1>
        <span id="product-count" class="section-link"></span>
      </div>

      <div id="product-grid" class="product-grid" aria-live="polite"></div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="site-container footer-inner">
      <p>&copy; PromoSphere. All rights reserved.</p>
      <p class="footer-disclaimer">PromoSphere is a discovery catalog featuring affiliated product links. We do not sell items directly or handle fulfillment.</p>
    </div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/components.js"></script>
  <script src="js/search.js"></script>
  <script src="js/catalog.js"></script>
</body>
</html>
